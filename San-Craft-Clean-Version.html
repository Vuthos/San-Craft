:root{
  --bg:#12101c;
  --surface:#1e1b2e;
  --surface2:#27233c;
  --line:#373155;
  --text:#f6f2ff;
  --muted:#b8b1d6;
  --accent:#ffd166;
  --pink:#ff6b9d;
  --green:#7ee8a3;
  --red:#ff7a7a;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Trebuchet MS",ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 0 0;
  background:radial-gradient(circle at 10% 0,#332a5c 0,transparent 38%),var(--bg)
}

.topo{
  max-width:1240px;
  margin:0 auto;
  padding:28px 22px 18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px
}

.topo h1{
  font-size:clamp(36px,6vw,62px);
  line-height:1;
  margin:0;
  letter-spacing:-2px
}

.topo p{
  color:var(--muted);
  margin:10px 0 0;
  font-size:17px;
  max-width:680px
}

.badge{
  background:#29243f;
  border:1px solid #51467f;
  color:#d8cfff;
  padding:9px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap
}

.layout{
  max-width:1240px;
  margin:0 auto;
  padding:6px 22px 24px;
  display:grid;
  grid-template-columns:310px minmax(0,1fr);
  gap:18px;
  align-items:start
}

.sidebar,.principal{
  min-width:0
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:18px
}

.login,.colecao,.status,.combinar,.caixa,.lab{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  box-shadow:0 14px 36px rgba(0,0,0,.18)
}

h2{
  margin:0 0 14px;
  font-size:22px
}

h3{
  margin:0 0 10px
}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:700
}

input,select,textarea{
  width:100%;
  margin-top:7px;
  background:#151226;
  border:1px solid #4a4272;
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,209,102,.15)
}

textarea{
  resize:vertical;
  line-height:1.5
}

.botoes{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px
}

button{
  background:#332d52;
  color:white;
  border:1px solid #4f4676;
  border-radius:11px;
  padding:10px 14px;
  font-weight:800
}

button:hover{
  filter:brightness(1.15)
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.primario{
  background:var(--accent);
  color:#2b1d00;
  border-color:var(--accent)
}

.perigo{
  background:#4a2431;
  border-color:#7a3a49;
  color:#ffd1d8
}

.sair{
  margin-top:10px;
  width:100%
}

.mini{
  color:var(--muted);
  font-size:13px;
  line-height:1.55
}

.jogador{
  font-size:16px
}

.tag{
  display:inline-block;
  background:#2b3a31;
  color:#b9f3cc;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px
}

.tag.criador{
  background:#46341c;
  color:#ffd979
}

.abas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  background:#151226;
  border:1px solid #4a4272;
  border-radius:12px;
  padding:5px;
  margin-bottom:14px
}

.aba{
  background:transparent;
  border:0;
  color:var(--muted);
  padding:9px 8px;
  border-radius:8px
}

.aba.ativa{
  background:var(--accent);
  color:#2b1d00
}

.aviso-alerta{
  background:#3a241f;
  border:1px solid #7a3a49;
  border-radius:12px;
  padding:12px 13px;
  color:#ffd1d8;
  font-size:13px;
  line-height:1.55;
  margin-bottom:12px
}

.aviso-alerta ol{
  margin:8px 0 0;
  padding-left:18px
}

.aviso-alerta li{
  margin:4px 0
}

.senha-campo{
  position:relative;
  display:block
}

.senha-campo input{
  padding-right:48px
}

.olho{
  position:absolute;
  right:5px;
  top:12px;
  width:38px;
  height:38px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  font-size:18px
}

.login .mini{
  margin-top:10px
}

.colecao-topo{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.colecao-topo strong{
  color:var(--accent)
}

.grade{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.elemento{
  aspect-ratio:1;
  background:#16132a;
  border:1px solid #39325f;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:5px
}

.elemento span{
  font-size:27px
}

.elemento small{
  font-size:11px;
  line-height:1.1
}

.elemento.ativo{
  border-color:var(--accent);
  background:#3b2d18
}

.principal{
  display:flex;
  flex-direction:column;
  gap:16px
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px
}

.status>div{
  flex:1
}

.status span{
  display:block;
  color:var(--muted);
  font-size:13px
}

.status strong{
  display:block;
  margin:6px 0
}

.barra{
  height:9px;
  background:#17142a;
  border-radius:99px;
  overflow:hidden
}

.barra i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--pink),var(--accent));
  transition:width .3s
}

.interruptor{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  color:var(--text)
}

.interruptor input{
  width:20px;
  margin:0;
  accent-color:var(--accent)
}

.aviso{
  background:#2e2a16;
  border:1px solid #6f5b25;
  color:#ffe9a8;
  border-radius:12px;
  padding:12px 14px;
  font-weight:700
}

.combinar{
  text-align:center
}

.slots{
  display:flex;
  justify-content:center;
  align-items:stretch;
  gap:14px;
  margin:22px 0
}

.slot{
  text-align:left;
  flex:1;
  max-width:300px
}

.slot>span{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px
}

.slot-card{
  margin-top:7px;
  background:#151226;
  border:1px solid #4a4272;
  border-radius:16px;
  padding:15px;
  display:flex;
  flex-direction:column
}

.slot-card b{
  font-size:46px
}

.slot-card strong{
  font-size:18px;
  margin:4px 0
}

.slot-card select{
  margin-top:10px
}

.mais{
  font-size:36px;
  align-self:center;
  color:var(--accent)
}

.combinar-btn{
  font-size:20px;
  padding:15px 32px;
  border-radius:14px;
  background:linear-gradient(90deg,#ff6b9d,#ffd166);
  color:#251505;
  border:0;
  box-shadow:0 8px 22px rgba(255,107,157,.25)
}

.ordem{
  color:var(--muted);
  font-size:13px
}

.duas-colunas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}

.caixa ul{
  margin:0;
  padding-left:18px;
  line-height:1.6
}

.caixa li{
  margin:5px 0
}

.escondido{
  display:none
}

.sr{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0)
}

.pacote-jogador textarea{
  margin-top:10px
}

.lab{
  background:#211a31;
  border-color:#57447d
}

.lab-topo{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.lab-topo span{
  background:#3c2d5f;
  color:#dfcfff;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px
}

.passos{
  padding-left:20px;
  color:#d5cbff;
  line-height:1.6
}

.form-lab{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin:16px 0
}

.form-lab .largo{
  grid-column:1/-1
}

.lista-secreta{
  list-style:none;
  padding:0
}

.lista-secreta li{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  background:#17132a;
  border:1px solid #473f6e;
  border-radius:12px;
  padding:10px;
  margin:8px 0
}

.lista-secreta button{
  padding:7px 10px
}

.jogador-info{
  border-style:dashed
}

footer{
  text-align:center;
  color:var(--muted);
  padding:8px 20px 30px;
  font-size:13px
}

.confete{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  overflow:hidden
}

.confete span{
  position:absolute;
  top:-20px;
  font-size:24px;
  animation:cair 1.6s ease-in forwards
}

@keyframes cair{
  to{
    transform:translateY(105vh) rotate(300deg);
    opacity:.1
  }
}

@media(max-width:760px){
  .topo{
    flex-direction:column
  }

  .topo p{
    font-size:15px
  }

  .badge{
    white-space:normal
  }

  .layout{
    grid-template-columns:1fr;
    padding-inline:14px
  }

  .sidebar{
    order:2
  }

  .principal{
    order:1
  }

  .status{
    flex-direction:column;
    align-items:stretch
  }

  .duas-colunas,.form-lab{
    grid-template-columns:1fr
  }

  .slots{
    flex-direction:column;
    align-items:stretch
  }

  .slot{
    max-width:none
  }

  .mais{
    transform:rotate(90deg);
    align-self:center
  }

  .grade{
    grid-template-columns:repeat(4,1fr)
  }
}

@media(max-width:430px){
  .topo{
    padding-inline:14px
  }

  .layout{
    gap:14px
  }

  .grade{
    grid-template-columns:repeat(3,1fr)
  }

  .botoes button{
    flex:1 1 140px
  }

  .combinar-btn{
    width:100%
  }

  .lab-topo{
    align-items:flex-start;
    flex-direction:column;
    gap:8px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#12101c;
    --surface:#1e1b2e
  }
}
