:root{
  --bg:#0a0a1a;
  --surface:#12122b;
  --surface2:#17173a;
  --line:#2b2b6b;
  --text:#eafcff;
  --muted:#b9c2ff;
  --accent:#00f0ff;
  --pink:#ff00ff;
  --purple:#a100ff;
  --green:#00ff88;
  --yellow:#ffff00;
  --red:#ff4d6d;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Trebuchet MS",ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 0 0;
  background:radial-gradient(circle at 8% 0,rgba(0,240,255,.18) 0,transparent 36%),radial-gradient(circle at 92% 8%,rgba(255,0,255,.16) 0,transparent 34%),radial-gradient(circle at 50% 100%,rgba(161,0,255,.12) 0,transparent 40%),var(--bg)
}

.topo{
  max-width:1240px;
  margin:0 auto;
  padding:28px 22px 18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px
}

.topo h1{
  font-size:clamp(36px,6vw,62px);
  line-height:1;
  margin:0;
  letter-spacing:-1px;
  color:#fff;
  text-shadow:0 0 8px rgba(0,240,255,.9),0 0 20px rgba(0,240,255,.55),0 0 34px rgba(255,0,255,.45)
}

.topo p{
  color:var(--muted);
  margin:10px 0 0;
  font-size:17px;
  max-width:680px
}

.badge{
  background:#101038;
  border:1px solid rgba(0,240,255,.65);
  color:#c8fbff;
  padding:9px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  box-shadow:0 0 14px rgba(0,240,255,.28)
}

.toast{
  max-width:1240px;
  margin:0 auto 14px;
  padding:12px 16px;
  background:#0f2430;
  border:1px solid rgba(0,240,255,.7);
  border-radius:14px;
  color:#dffcff;
  font-weight:800;
  box-shadow:0 0 18px rgba(0,240,255,.28);
  margin-inline:22px
}

.layout{
  max-width:1440px;
  margin:0 auto;
  padding:6px 22px 24px;
  display:grid;
  grid-template-columns:300px minmax(0,1fr) 300px;
  gap:18px;
  align-items:start
}

.colecao-direita{
  position:sticky;
  top:12px
}

.busca-elemento{
  margin:12px 0 8px
}

.busca-elemento input{
  margin-top:0
}

.busca-contador{
  font-size:12px
}

.colecao-lista{
  max-height:62vh;
  overflow-y:auto;
  padding-right:4px
}

.colecao-lista .grade{
  display:flex;
  flex-direction:row;
  flex-wrap:wrap;
  gap:8px;
  justify-content:flex-start;
  align-items:flex-start
}

.dica-arrastar{
  margin:10px 0 0
}

.lousa-wrap{
  padding:0;
  overflow:hidden
}

.lousa-cabecalho{
  padding:18px 18px 0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  flex-wrap:wrap
}

.lousa-cabecalho h2{
  margin-bottom:6px
}

.lousa-sub{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.lousa-viewport{
  margin:16px 12px 12px;
  border-radius:16px;
  overflow:auto;
  overscroll-behavior:contain
}

.lousa-viewport.expandida{
  margin-inline:4px
}

.lousa{
  position:relative;
  width:100%;
  min-height:650px;
  padding:18px;
  border:1px dashed rgba(0,240,255,.55);
  border-radius:16px;
  background-color:#08081e;
  background-image:radial-gradient(rgba(0,240,255,.28) 1px,transparent 1px);
  background-size:22px 22px;
  overflow:hidden;
  touch-action:none;
  transform-origin:top left
}

.zoom-controles{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap
}

.zoom-controles button{
  min-width:42px;
  padding:9px 10px
}

.zoom-controles .zoom-valor{
  min-width:62px;
  text-align:center;
  background:#0d0d24;
  border:1px solid rgba(0,240,255,.5);
  border-radius:11px;
  padding:9px 6px;
  font-weight:800;
  color:#fff
}

.expandir-lousa{
  white-space:nowrap
}

.lousa-toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin:0 12px 12px;
  padding:10px 12px;
  background:#0d0d24;
  border:1px solid rgba(0,240,255,.65);
  border-radius:14px;
  box-shadow:0 0 16px rgba(0,240,255,.25)
}

.lousa-toolbar strong{
  color:#fff
}

.lousa-toolbar .perigo{
  margin-left:auto
}

.visitante-link{
  background:transparent;
  border:0;
  box-shadow:none;
  color:var(--accent);
  text-decoration:underline;
  padding:8px 4px;
  font-size:13px
}

.visitante-link:hover{
  filter:brightness(1.2);
  box-shadow:none
}

.lousa.vazia::after{
  content:"Arraste um elemento da coleção para cá";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:var(--muted);
  font-size:14px;
  text-align:center;
  pointer-events:none;
  max-width:80%
}

.lousa-item{
  position:absolute;
  transform:translate(-50%,-50%);
  width:auto;
  min-width:0;
  max-width:260px;
  display:inline-flex;
  flex:0 0 auto;
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:7px;
  padding:6px 10px;
  background:#12122b;
  border:1px solid rgba(0,240,255,.65);
  border-radius:999px;
  box-shadow:0 0 16px rgba(0,240,255,.22),0 10px 22px rgba(0,0,0,.35);
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  touch-action:none;
  white-space:nowrap
}

.lousa-item:active{
  cursor:grabbing
}

.lousa-item.selecionado{
  border:2px solid var(--accent);
  background:#08333c;
  box-shadow:0 0 0 3px rgba(0,240,255,.45),0 0 22px rgba(0,240,255,.65)
}

.lousa-item.alvo{
  border-color:var(--pink);
  box-shadow:0 0 20px rgba(255,0,255,.55);
  transform:translate(-50%,-50%) scale(1.07)
}

.lousa-item.fora{
  opacity:.45;
  border-color:var(--red);
  border-style:dashed;
  box-shadow:0 0 12px rgba(255,77,109,.35)
}

.lousa-item .emoji{
  font-size:21px;
  line-height:1;
  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  cursor:grab;
  flex:0 0 auto
}

.lousa-item .nome{
  font-size:14px;
  font-weight:800;
  line-height:1.2;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  cursor:grab
}

.lixeira-lousa{
  position:absolute;
  right:12px;
  bottom:12px;
  z-index:5;
  width:42px;
  height:42px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:#1a1030;
  border:1px solid rgba(255,0,255,.65);
  box-shadow:0 0 14px rgba(255,0,255,.28);
  font-size:20px;
  line-height:1
}

.lixeira-lousa:hover{
  border-color:var(--pink);
  filter:brightness(1.25)
}

.lixeira-lousa:active{
  transform:scale(.94)
}

.lousa-rodape{
  padding:0 18px 16px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center
}

.lousa-rodape .mini{
  margin:0
}

.sidebar,.principal{
  min-width:0
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:18px
}

.login,.colecao,.status,.combinar,.caixa,.lab{
  background:var(--surface);
  border:1px solid rgba(0,240,255,.35);
  border-radius:20px;
  padding:18px;
  box-shadow:0 0 18px rgba(0,240,255,.10),0 14px 36px rgba(0,0,0,.28)
}

h2{
  margin:0 0 14px;
  font-size:22px
}

h3{
  margin:0 0 10px
}

h2,h3{
  color:#fff;
  text-shadow:0 0 12px rgba(0,240,255,.35)
}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:700
