@keyframes popIn{
  0%{
    transform:scale(.6) rotate(-4deg);
    opacity:0
  }

  70%{
    transform:scale(1.08) rotate(2deg)
  }

  100%{
    transform:scale(1) rotate(0);
    opacity:1
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-8px) rotate(2deg)
  }
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(-3deg)
  }

  50%{
    transform:rotate(3deg)
  }
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0);
    opacity:1
  }

  100%{
    transform:translateY(340px) rotate(620deg);
    opacity:0
  }
}

@keyframes shakeX{
  0%,100%{
    transform:translateX(0)
  }

  20%{
    transform:translateX(-8px)
  }

  40%{
    transform:translateX(8px)
  }

  60%{
    transform:translateX(-6px)
  }

  80%{
    transform:translateX(5px)
  }
}

@keyframes sparkle{
  0%,100%{
    transform:scale(.8);
    opacity:.55
  }

  50%{
    transform:scale(1.25);
    opacity:1
  }
}

.animate-pop{
  animation:popIn .45s cubic-bezier(.2,1.4,.4,1) both;
}

.animate-floaty{
  animation:floaty 3s ease-in-out infinite;
}

.animate-wiggle{
  animation:wiggle .35s ease-in-out infinite;
}

.animate-shake{
  animation:shakeX .45s ease-in-out;
}

.animate-sparkle{
  animation:sparkle 1.1s ease-in-out infinite;
}

.confetti-piece{
  position:absolute;
  top:-12px;
  border-radius:2px;
  animation:fall 1.35s cubic-bezier(.2,.7,.4,1) forwards;
  pointer-events:none;
