:root{
  --bg:#0a0a1a;
  --surface:#12122b;
  --surface2:#17173a;
  --line:#2b2b6b;
  --text:#eafcff;
  --muted:#b9c2ff;
  --accent:#00f0ff;
  --pink:#ff00ff;
  --purple:#a100ff;
  --green:#00ff88;
  --yellow:#ffff00;
  --red:#ff4d6d;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Trebuchet MS",ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 0 0;
  background:radial-gradient(circle at 8% 0,rgba(0,240,255,.18) 0,transparent 36%),radial-gradient(circle at 92% 8%,rgba(255,0,255,.16) 0,transparent 34%),radial-gradient(circle at 50% 100%,rgba(161,0,255,.12) 0,transparent 40%),var(--bg)
}

.topo{
  max-width:1240px;
  margin:0 auto;
  padding:28px 22px 18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px
}

.topo h1{
  font-size:clamp(36px,6vw,62px);
  line-height:1;
  margin:0;
  letter-spacing:-1px;
  color:#fff;
  text-shadow:0 0 8px rgba(0,240,255,.9),0 0 20px rgba(0,240,255,.55),0 0 34px rgba(255,0,255,.45)
}

.topo p{
  color:var(--muted);
  margin:10px 0 0;
  font-size:17px;
  max-width:680px
}

.badge{
  background:#101038;
  border:1px solid rgba(0,240,255,.65);
  color:#c8fbff;
  padding:9px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  box-shadow:0 0 14px rgba(0,240,255,.28)
}

.toast{
  max-width:1240px;
  margin:0 auto 14px;
  padding:12px 16px;
  background:#0f2430;
  border:1px solid rgba(0,240,255,.7);
  border-radius:14px;
  color:#dffcff;
  font-weight:800;
  box-shadow:0 0 18px rgba(0,240,255,.28);
  margin-inline:22px
}

.layout{
  max-width:1440px;
  margin:0 auto;
  padding:6px 22px 24px;
  display:grid;
  grid-template-columns:300px minmax(0,1fr) 300px;
  gap:18px;
  align-items:start
}

.colecao-direita{
  position:sticky;
  top:12px
}

.busca-elemento{
  margin:12px 0 8px
}

.busca-elemento input{
  margin-top:0
}

.busca-contador{
  font-size:12px
}

.colecao-lista{
  max-height:62vh;
  overflow-y:auto;
  padding-right:4px
}

.colecao-lista .grade{
  grid-template-columns:repeat(2,1fr)
}

.dica-arrastar{
  margin:10px 0 0
}

.lousa-wrap{
  padding:0;
  overflow:hidden
}

.lousa-cabecalho{
  padding:18px 18px 0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  flex-wrap:wrap
}

.lousa-cabecalho h2{
  margin-bottom:6px
}

.lousa-sub{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.lousa-acoes{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  flex:1 1 auto;
  min-width:0;
  justify-content:flex-end
}

.lousa-acoes button{
  flex:1 1 150px;
  max-width:230px;
  white-space:normal
}

.lousa{
  position:relative;
  min-height:420px;
  margin:16px 12px 12px;
  border:1px dashed rgba(0,240,255,.55);
  border-radius:16px;
  background-color:#08081e;
  background-image:radial-gradient(rgba(0,240,255,.28) 1px,transparent 1px);
  background-size:22px 22px;
  overflow:hidden;
  touch-action:none
}

.lousa.vazia::after{
  content:"Arraste um elemento da coleção para cá";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:var(--muted);
  font-size:14px;
  text-align:center;
  pointer-events:none;
  max-width:80%
}

.lousa-item{
  position:absolute;
  transform:translate(-50%,-50%);
  min-width:92px;
  max-width:190px;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:10px 12px;
  background:#12122b;
  border:1px solid rgba(0,240,255,.65);
  border-radius:14px;
  box-shadow:0 0 16px rgba(0,240,255,.22),0 10px 22px rgba(0,0,0,.35);
  cursor:grab;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none;
  touch-action:none
}

.lousa-item:active{
  cursor:grabbing
}

.lousa-item.selecionado{
  border-color:var(--yellow);
  background:#24240a;
  box-shadow:0 0 18px rgba(255,255,0,.5)
}

.lousa-item.alvo{
  border-color:var(--pink);
  box-shadow:0 0 20px rgba(255,0,255,.55);
  transform:translate(-50%,-50%) scale(1.07)
}

.lousa-item .emoji{
  font-size:24px;
  line-height:1;
  -moz-user-select:none;
       user-select:none;
  -webkit-user-select:none;
  cursor:grab;
  flex:0 0 auto
}

.lousa-item .nome{
  font-size:14px;
  font-weight:800;
  line-height:1.2;
  text-align:left;
  word-break:break-word;
  -moz-user-select:text;
       user-select:text;
  -webkit-user-select:text;
  cursor:text
}

.lousa-rodape{
  padding:0 18px 16px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center
}

.lousa-rodape .mini{
  margin:0
}

.sidebar,.principal{
  min-width:0
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:18px
}

.login,.colecao,.status,.combinar,.caixa,.lab{
  background:var(--surface);
  border:1px solid rgba(0,240,255,.35);
  border-radius:20px;
  padding:18px;
  box-shadow:0 0 18px rgba(0,240,255,.10),0 14px 36px rgba(0,0,0,.28)
}

h2{
  margin:0 0 14px;
  font-size:22px
}

h3{
  margin:0 0 10px
}

h2,h3{
  color:#fff;
  text-shadow:0 0 12px rgba(0,240,255,.35)
}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:700
}

input,select,textarea{
  width:100%;
  margin-top:7px;
  background:#0d0d24;
  border:1px solid #3a3a7a;
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,240,255,.22),0 0 18px rgba(0,240,255,.35)
}

textarea{
  resize:vertical;
  line-height:1.5
}

.botoes{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px
}

button{
  background:#17173a;
  color:#eafcff;
  border:1px solid rgba(0,240,255,.5);
  border-radius:11px;
  padding:10px 14px;
  font-weight:800;
  box-shadow:0 0 10px rgba(0,240,255,.16)
}

button:hover{
  filter:brightness(1.18);
  box-shadow:0 0 16px rgba(0,240,255,.32)
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.primario{
  background:var(--accent);
  color:#031018;
  border-color:var(--accent);
  box-shadow:0 0 18px rgba(0,240,255,.55)
}

.perigo{
  background:#2a1220;
  border-color:#ff00ff;
  color:#ffd1f5;
  box-shadow:0 0 12px rgba(255,0,255,.22)
}

.sair{
  margin-top:10px;
  width:100%
}

.mini{
  color:var(--muted);
  font-size:13px;
  line-height:1.55
}

.jogador{
  font-size:16px
}

.tag{
  display:inline-block;
  background:#0f2b24;
  color:#8dffc8;
  border:1px solid rgba(0,255,136,.55);
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  box-shadow:0 0 10px rgba(0,255,136,.18)
}

.tag.criador{
  background:#2a1238;
  color:#ff9bff;
  border-color:#ff00ff
}

.abas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  background:#0d0d24;
  border:1px solid #3a3a7a;
  border-radius:12px;
  padding:5px;
  margin-bottom:14px
}

.aba{
  background:transparent;
  border:0;
  color:var(--muted);
  padding:9px 8px;
  border-radius:8px
}

.aba.ativa{
  background:var(--accent);
  color:#031018;
  box-shadow:0 0 14px rgba(0,240,255,.5)
}

.aviso-alerta{
  background:#2a1220;
  border:1px solid #ff00ff;
  border-radius:12px;
  padding:12px 13px;
  color:#ffd1f5;
  font-size:13px;
  line-height:1.55;
  margin-bottom:12px
}

.aviso-alerta ol{
  margin:8px 0 0;
  padding-left:18px
}

.aviso-alerta li{
  margin:4px 0
}

.senha-campo{
  position:relative;
  display:block
}

.senha-campo input{
  padding-right:48px
}

.olho{
  position:absolute;
  right:5px;
  top:12px;
  width:38px;
  height:38px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  font-size:18px
}

.login .mini{
  margin-top:10px
}

.colecao-topo{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.colecao-topo strong{
  color:var(--yellow);
  text-shadow:0 0 10px rgba(255,255,0,.45)
}

.infinito{
  display:inline-block;
  background:#0f2430;
  border:1px solid rgba(0,240,255,.6);
  color:#c8fbff;
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  font-weight:800;
  box-shadow:0 0 10px rgba(0,240,255,.18)
}

.colecao .infinito{
  margin-top:2px
}

.temperatura{
  color:#c8fbff;
  font-size:13px;
  font-weight:800;
  margin:10px 0 0
}

.aviso-ia{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  margin:10px 0 0
}

.combinar .aviso-ia{
  background:#0f2430;
  border:1px solid rgba(0,240,255,.35);
  border-radius:12px;
  padding:10px 12px
}

.ia-badge.original{
  background:#2a1238;
  color:#ff9bff;
  border-color:#ff00ff
}

footer .aviso-ia{
  max-width:760px;
  margin:8px auto 0
}

.grade{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.elemento{
  aspect-ratio:1;
  background:#0d0d24;
  border:1px solid #33337a;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:5px
}

.elemento span{
  font-size:27px
}

.elemento small{
  font-size:11px;
  line-height:1.1
}

.elemento.ativo{
  border-color:var(--yellow);
  background:#24240a;
  box-shadow:0 0 14px rgba(255,255,0,.35)
}

.principal{
  display:flex;
  flex-direction:column;
  gap:16px
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px
}

.status>div{
  flex:1
}

.status span{
  display:block;
  color:var(--muted);
  font-size:13px
}

.status strong{
  display:block;
  margin:6px 0
}

.barra{
  height:9px;
  background:#0d0d24;
  border:1px solid rgba(0,240,255,.3);
  border-radius:99px;
  overflow:hidden
}

.barra i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--pink),var(--purple));
  transition:width .3s;
  box-shadow:0 0 10px rgba(0,240,255,.5)
}

.interruptor{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  color:var(--text)
}

.interruptor input{
  width:20px;
  margin:0;
  accent-color:var(--accent)
}

.aviso{
  background:#0f2430;
  border:1px solid rgba(0,240,255,.7);
  color:#dffcff;
  border-radius:12px;
  padding:12px 14px;
  font-weight:700
}

.combinar{
  text-align:center
}

.slots{
  display:flex;
  justify-content:center;
  align-items:stretch;
  gap:14px;
  margin:22px 0
}

.slot{
  text-align:left;
  flex:1;
  max-width:300px
}

.slot>span{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px
}

.slot-card{
  margin-top:7px;
  background:#151226;
  border:1px solid #4a4272;
  border-radius:16px;
  padding:15px;
  display:flex;
  flex-direction:column
}

.slot-card b{
  font-size:46px
}

.slot-card strong{
  font-size:18px;
  margin:4px 0
}

.slot-card select{
  margin-top:10px
}

.mais{
  font-size:36px;
  align-self:center;
  color:var(--accent)
}

.slot-card{
  margin-top:7px;
  background:#0d0d24;
  border:1px solid rgba(0,240,255,.4);
  border-radius:16px;
  padding:15px;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 14px rgba(0,240,255,.12)
}

.slot-card b{
  font-size:46px
}

.slot-card strong{
  font-size:18px;
  margin:4px 0
}

.slot-card select{
  margin-top:10px
}

.mais{
  font-size:36px;
  align-self:center;
  color:var(--accent);
  text-shadow:0 0 12px rgba(0,240,255,.8)
}

.combinar-btn{
  font-size:20px;
  padding:15px 32px;
  border-radius:14px;
  background:linear-gradient(90deg,#00f0ff,#ff00ff);
  color:#0a0a1a;
  border:0;
  box-shadow:0 0 22px rgba(0,240,255,.5),0 0 22px rgba(255,0,255,.28)
}

.ordem{
  color:var(--muted);
  font-size:13px
}

.ia-card{
  margin-top:16px;
  text-align:left;
  background:#0d0d24;
  border:1px solid rgba(255,0,255,.7);
  border-radius:16px;
  padding:16px;
  box-shadow:0 0 20px rgba(255,0,255,.22)
}

.ia-card-topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}

.ia-badge{
  background:#2a1238;
  color:#ff9bff;
  border:1px solid #ff00ff;
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800
}

.ia-nome{
  font-size:22px;
  font-weight:900;
  color:#fff;
  margin:12px 0 6px
}

.ia-nome span{
  font-size:30px
}

.ia-motivo{
  color:#dffcff;
  font-size:14px;
  line-height:1.55;
  margin:0 0 6px
}

.duas-colunas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}

.caixa ul{
  margin:0;
  padding-left:18px;
  line-height:1.6
}

.caixa li{
  margin:5px 0
}

.escondido{
  display:none
}

.sr{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0)
}

.pacote-jogador textarea{
  margin-top:10px
}

.lab{
  background:#170a2b;
  border-color:rgba(161,0,255,.75);
  box-shadow:0 0 22px rgba(161,0,255,.25),0 14px 36px rgba(0,0,0,.28)
}

.lab-topo{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.lab-topo span{
  background:#2a1238;
  color:#ff9bff;
  border:1px solid #ff00ff;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px
}

.passos{
  padding-left:20px;
  color:#d5cbff;
  line-height:1.6
}

.form-lab{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin:16px 0
}

.form-lab .largo{
  grid-column:1/-1
}

.lista-secreta{
  list-style:none;
  padding:0
}

.lista-secreta li{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  background:#0d0d24;
  border:1px solid #473f6e;
  border-radius:12px;
  padding:10px;
  margin:8px 0
}

.lista-secreta button{
  padding:7px 10px
}

.campo-emoji{
  min-width:0
}

.escolher-emoji{
  margin-top:8px;
  width:100%;
  background:#2a1238;
  border-color:#ff00ff;
  color:#ffd1f5;
  box-shadow:0 0 14px rgba(255,0,255,.25)
}

.painel-emoji{
  margin-top:10px;
  background:#0d0d24;
  border:1px solid rgba(161,0,255,.8);
  border-radius:16px;
  padding:14px;
  box-shadow:0 0 20px rgba(161,0,255,.25)
}

.conversor{
  padding-bottom:14px;
  border-bottom:1px solid #3a3a7a;
  margin-bottom:12px
}

.conversor strong{
  color:#fff;
  font-size:14px
}

.conversor-linha{
  display:flex;
  gap:8px;
  margin-top:7px
}

.conversor-linha input{
  margin-top:0;
  flex:1;
  min-width:0
}

.conversor-linha button{
  white-space:nowrap
}

.conversor .mini{
  margin:8px 0 0
}

.sugestoes{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px
}

.chip-emoji{
  font-size:28px;
  line-height:1;
  padding:8px 10px;
  border-radius:999px;
  background:#170a2b;
  border-color:#ff00ff;
  box-shadow:0 0 14px rgba(255,0,255,.25)
}

.categoria-emoji{
  margin-top:14px
}

.categoria-emoji h4{
  margin:0 0 8px;
  color:#c8fbff;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.6px
}

.grade-emoji{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px
}

.botao-emoji{
  font-size:24px;
  line-height:1;
  padding:9px 4px;
  background:#12122b;
  border-color:#33337a
}

.botao-emoji:hover{
  border-color:var(--accent);
  transform:scale(1.06)
}

.teclado-barra{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
  padding:8px;
  background:#08081a;
  border:1px solid #3a3a7a;
  border-radius:14px
}

.teclado-topo{
  position:sticky;
  top:0;
  z-index:1
}

.aba-emoji{
  min-width:0;
  flex:1 1 68px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:7px 3px;
  background:transparent;
  border:1px solid transparent;
  border-radius:10px;
  box-shadow:none;
  color:var(--muted)
}

.aba-emoji span{
  font-size:23px;
  line-height:1
}

.aba-emoji small{
  font-size:10px;
  line-height:1.2;
  white-space:nowrap
}

.aba-emoji.ativa{
  background:var(--accent);
  color:#031018;
  border-color:var(--accent);
  box-shadow:0 0 14px rgba(0,240,255,.45)
}

.teclado-cabecalho{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 2px 8px;
  color:#fff
}

.teclado-cabecalho span{
  color:var(--muted);
  font-size:12px
}

.teclado-grade{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}

.tecla-emoji{
  font-size:34px;
  line-height:1;
  min-height:64px;
  padding:10px 4px;
  background:#12122b;
  border:1px solid #33337a;
  border-radius:14px;
  box-shadow:none
}

.tecla-emoji:hover{
  border-color:var(--accent);
  transform:scale(1.05);
  box-shadow:0 0 16px rgba(0,240,255,.28)
}

.tecla-emoji:active{
  transform:scale(.97)
}

.paginacao{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:14px 0
}

.paginacao strong{
  color:#fff;
  font-size:14px
}

.paginacao button{
  flex:0 1 auto
}

.teclado-rodape{
  margin-bottom:12px
}

.fechar-picker{
  margin-top:14px;
  width:100%
}

.jogador-info{
  border-style:dashed
}

footer{
  text-align:center;
  color:var(--muted);
  padding:8px 20px 30px;
  font-size:13px
}

.confete{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  overflow:hidden
}

.confete span{
  position:absolute;
  top:-20px;
  font-size:24px;
  animation:cair 1.6s ease-in forwards
}

@keyframes cair{
  to{
    transform:translateY(105vh) rotate(300deg);
    opacity:.1
  }
}

@media(max-width:1080px){
  .layout{
    grid-template-columns:280px minmax(0,1fr)
  }

  .colecao-direita{
    grid-column:1/-1;
    position:static
  }

  .colecao-lista{
    max-height:340px
  }

  .colecao-lista .grade{
    grid-template-columns:repeat(4,1fr)
  }
}

@media(max-width:760px){
  .topo{
    flex-direction:column
  }

  .topo p{
    font-size:15px
  }

  .badge{
    white-space:normal
  }

  .layout{
    grid-template-columns:1fr;
    padding-inline:14px
  }

  .sidebar{
    order:3
  }

  .principal{
    order:1
  }

  .colecao-direita{
    order:2
  }

  .status{
    flex-direction:column;
    align-items:stretch
  }

  .duas-colunas,.form-lab{
    grid-template-columns:1fr
  }

  .slots{
    flex-direction:column;
    align-items:stretch
  }

  .slot{
    max-width:none
  }

  .mais{
    transform:rotate(90deg);
    align-self:center
  }

  .grade{
    grid-template-columns:repeat(4,1fr)
  }

  .aba-emoji small{
    font-size:9px
  }

  .tecla-emoji{
    font-size:30px;
    min-height:58px
  }

  .lousa{
    min-height:360px
  }

  .lousa-item{
    min-width:84px
  }

  .lousa-cabecalho{
    flex-direction:column
  }

  .lousa-acoes{
    width:100%;
    justify-content:stretch
  }

  .lousa-acoes button{
    flex:1 1 130px;
    max-width:none
  }
}

@media(max-width:430px){
  .topo{
    padding-inline:14px
  }

  .layout{
    gap:14px
  }

  .grade{
    grid-template-columns:repeat(3,1fr)
  }

  .botoes button{
    flex:1 1 140px
  }

  .combinar-btn{
    width:100%
  }

  .lab-topo{
    align-items:flex-start;
    flex-direction:column;
    gap:8px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0a1a;
    --surface:#12122b
  }
}
