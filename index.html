:root{
  --bg:#0a0a1a;
  --surface:#12122b;
  --surface2:#17173a;
  --line:#2b2b6b;
  --text:#eafcff;
  --muted:#b9c2ff;
  --accent:#00f0ff;
  --pink:#ff00ff;
  --purple:#a100ff;
  --green:#00ff88;
  --yellow:#ffff00;
  --red:#ff4d6d;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Trebuchet MS",ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 0 0;
  background:radial-gradient(circle at 8% 0,rgba(0,240,255,.18) 0,transparent 36%),radial-gradient(circle at 92% 8%,rgba(255,0,255,.16) 0,transparent 34%),radial-gradient(circle at 50% 100%,rgba(161,0,255,.12) 0,transparent 40%),var(--bg)
}

.topo{
  max-width:1240px;
  margin:0 auto;
  padding:28px 22px 18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px
}

.topo h1{
  font-size:clamp(36px,6vw,62px);
  line-height:1;
  margin:0;
  letter-spacing:-1px;
  color:#fff;
  text-shadow:0 0 8px rgba(0,240,255,.9),0 0 20px rgba(0,240,255,.55),0 0 34px rgba(255,0,255,.45)
}

.topo p{
  color:var(--muted);
  margin:10px 0 0;
  font-size:17px;
  max-width:680px
}

.badge{
  background:#101038;
  border:1px solid rgba(0,240,255,.65);
  color:#c8fbff;
  padding:9px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  box-shadow:0 0 14px rgba(0,240,255,.28)
}

.toast{
  max-width:1240px;
  margin:0 auto 14px;
  padding:12px 16px;
  background:#0f2430;
  border:1px solid rgba(0,240,255,.7);
  border-radius:14px;
  color:#dffcff;
  font-weight:800;
  box-shadow:0 0 18px rgba(0,240,255,.28);
  margin-inline:22px
}

.layout{
  max-width:1240px;
  margin:0 auto;
  padding:6px 22px 24px;
  display:grid;
  grid-template-columns:310px minmax(0,1fr);
  gap:18px;
  align-items:start
}

.sidebar,.principal{
  min-width:0
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:18px
}

.login,.colecao,.status,.combinar,.caixa,.lab{
  background:var(--surface);
  border:1px solid rgba(0,240,255,.35);
  border-radius:20px;
  padding:18px;
  box-shadow:0 0 18px rgba(0,240,255,.10),0 14px 36px rgba(0,0,0,.28)
}

h2{
  margin:0 0 14px;
  font-size:22px
}

h3{
  margin:0 0 10px
}

h2,h3{
  color:#fff;
  text-shadow:0 0 12px rgba(0,240,255,.35)
}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:700
}

input,select,textarea{
  width:100%;
  margin-top:7px;
  background:#0d0d24;
  border:1px solid #3a3a7a;
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,240,255,.22),0 0 18px rgba(0,240,255,.35)
}

textarea{
  resize:vertical;
  line-height:1.5
}

.botoes{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px
}

button{
  background:#17173a;
  color:#eafcff;
  border:1px solid rgba(0,240,255,.5);
  border-radius:11px;
  padding:10px 14px;
  font-weight:800;
  box-shadow:0 0 10px rgba(0,240,255,.16)
}

button:hover{
  filter:brightness(1.18);
  box-shadow:0 0 16px rgba(0,240,255,.32)
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.primario{
  background:var(--accent);
  color:#031018;
  border-color:var(--accent);
  box-shadow:0 0 18px rgba(0,240,255,.55)
}

.perigo{
  background:#2a1220;
  border-color:#ff00ff;
  color:#ffd1f5;
  box-shadow:0 0 12px rgba(255,0,255,.22)
}

.sair{
  margin-top:10px;
  width:100%
}

.mini{
  color:var(--muted);
  font-size:13px;
  line-height:1.55
}

.jogador{
  font-size:16px
}

.tag{
  display:inline-block;
  background:#0f2b24;
  color:#8dffc8;
  border:1px solid rgba(0,255,136,.55);
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  box-shadow:0 0 10px rgba(0,255,136,.18)
}

.tag.criador{
  background:#2a1238;
  color:#ff9bff;
  border-color:#ff00ff
}

.abas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  background:#0d0d24;
  border:1px solid #3a3a7a;
  border-radius:12px;
  padding:5px;
  margin-bottom:14px
}

.aba{
  background:transparent;
  border:0;
  color:var(--muted);
  padding:9px 8px;
  border-radius:8px
}

.aba.ativa{
  background:var(--accent);
  color:#031018;
  box-shadow:0 0 14px rgba(0,240,255,.5)
}

.aviso-alerta{
  background:#2a1220;
  border:1px solid #ff00ff;
  border-radius:12px;
  padding:12px 13px;
  color:#ffd1f5;
  font-size:13px;
  line-height:1.55;
  margin-bottom:12px
}

.aviso-alerta ol{
  margin:8px 0 0;
  padding-left:18px
}

.aviso-alerta li{
  margin:4px 0
}

.senha-campo{
  position:relative;
  display:block
}

.senha-campo input{
  padding-right:48px
}

.olho{
  position:absolute;
  right:5px;
  top:12px;
  width:38px;
  height:38px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  font-size:18px
}

.login .mini{
  margin-top:10px
}

.colecao-topo{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.colecao-topo strong{
  color:var(--yellow);
  text-shadow:0 0 10px rgba(255,255,0,.45)
}

.grade{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.elemento{
  aspect-ratio:1;
  background:#0d0d24;
  border:1px solid #33337a;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:5px
}

.elemento span{
  font-size:27px
}

.elemento small{
  font-size:11px;
  line-height:1.1
}

.elemento.ativo{
  border-color:var(--yellow);
  background:#24240a;
  box-shadow:0 0 14px rgba(255,255,0,.35)
}

.principal{
  display:flex;
  flex-direction:column;
  gap:16px
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px
}

.status>div{
  flex:1
}

.status span{
  display:block;
  color:var(--muted);
  font-size:13px
}

.status strong{
  display:block;
  margin:6px 0
}

.barra{
  height:9px;
  background:#0d0d24;
  border:1px solid rgba(0,240,255,.3);
  border-radius:99px;
  overflow:hidden
}

.barra i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--pink),var(--purple));
  transition:width .3s;
  box-shadow:0 0 10px rgba(0,240,255,.5)
}

.interruptor{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  color:var(--text)
}

.interruptor input{
  width:20px;
  margin:0;
  accent-color:var(--accent)
}

.aviso{
  background:#0f2430;
  border:1px solid rgba(0,240,255,.7);
  color:#dffcff;
  border-radius:12px;
  padding:12px 14px;
  font-weight:700
}

.combinar{
  text-align:center
}

.slots{
  display:flex;
  justify-content:center;
  align-items:stretch;
  gap:14px;
  margin:22px 0
}

.slot{
  text-align:left;
  flex:1;
  max-width:300px
}

.slot>span{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px
}

.slot-card{
  margin-top:7px;
  background:#151226;
  border:1px solid #4a4272;
  border-radius:16px;
  padding:15px;
  display:flex;
  flex-direction:column
}

.slot-card b{
  font-size:46px
}

.slot-card strong{
  font-size:18px;
